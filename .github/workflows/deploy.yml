name: Deploy AWS Cost Optimization Dashboard

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "src/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.5"

jobs:
  debug-oidc-claims:
    name: Debug OIDC token claims
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Print decoded sub/aud claims
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

  deploy-dashboard:
    name: Deploy dashboard (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: debug-oidc-claims
    outputs:
      dashboard_bucket_name: ${{ steps.tf_outputs.outputs.dashboard_bucket_name }}
    defaults:
      run:
        working-directory: infra/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::378356708535:role/cost-optimization-dashboard-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf_outputs
        run: |
          echo "dashboard_bucket_name=$(terraform output -raw dashboard_bucket_name)" >> "$GITHUB_OUTPUT"

  deploy-collector:
    name: Deploy collector (Lambda + Scheduler)
    runs-on: ubuntu-latest
    needs: deploy-dashboard
    defaults:
      run:
        working-directory: infra/collector
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::378356708535:role/cost-optimization-dashboard-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="dashboard_bucket_name=${{ needs.deploy-dashboard.outputs.dashboard_bucket_name }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan